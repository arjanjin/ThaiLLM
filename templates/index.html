<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiLLM Pathumma Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e293b;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        header h1 span {
            color: #38bdf8;
        }

        .clear-btn {
            background: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #475569;
            color: #f1f5f9;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }

        .message.error {
            align-self: center;
            background: #7f1d1d;
            color: #fca5a5;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .typing {
            align-self: flex-start;
            color: #64748b;
            font-size: 0.85rem;
            padding: 8px 0;
        }

        .typing span {
            animation: blink 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        #input-area {
            background: #1e293b;
            padding: 16px 24px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            background: #0f172a;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #2563eb;
        }

        #message-input::placeholder {
            color: #475569;
        }

        #send-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #1d4ed8;
        }

        #send-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            color: #64748b;
            margin: auto;
            padding: 40px;
        }

        .welcome h2 {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .message { max-width: 90%; }
            header { padding: 12px 16px; }
            #input-area { padding: 12px 16px; }
            #chat-container { padding: 16px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span>ThaiLLM</span> Pathumma Chat</h1>
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
    </header>

    <div id="chat-container">
        <div class="welcome">
            <h2>Pathumma Chat</h2>
            <p>พิมพ์ข้อความเพื่อเริ่มสนทนากับ ThaiLLM</p>
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">ส่ง</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        let isFirstMessage = true;

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(text, role) {
            if (isFirstMessage) {
                chatContainer.innerHTML = '';
                isFirstMessage = false;
            }
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.innerHTML = 'กำลังพิมพ์ <span>.</span><span>.</span><span>.</span>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                hideTyping();

                if (res.ok) {
                    addMessage(data.reply, 'assistant');
                } else {
                    addMessage(data.error || 'เกิดข้อผิดพลาด', 'error');
                }
            } catch (err) {
                hideTyping();
                addMessage('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        async function clearChat() {
            await fetch('/api/clear', { method: 'POST' });
            chatContainer.innerHTML = `
                <div class="welcome">
                    <h2>Pathumma Chat</h2>
                    <p>พิมพ์ข้อความเพื่อเริ่มสนทนากับ ThaiLLM</p>
                </div>`;
            isFirstMessage = true;
            messageInput.focus();
        }

        messageInput.focus();
    </script>
</body>
</html>
