<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiLLM Pathumma Chat</title>

    <!-- Highlight.js theme (swapped on mode toggle) -->
    <link rel="stylesheet" id="hljs-theme"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <style>
        /* ── CSS variables for theming ── */
        :root {
            --bg:              #0f172a;
            --surface:         #1e293b;
            --surface2:        #162032;
            --border:          #334155;
            --text:            #e2e8f0;
            --text-muted:      #94a3b8;
            --text-dim:        #64748b;
            --msg-user-bg:     #2563eb;
            --msg-user-text:   #ffffff;
            --msg-ai-bg:       #1e293b;
            --msg-ai-text:     #e2e8f0;
            --msg-ai-border:   #334155;
            --code-inline-bg:  rgba(99,110,123,0.3);
            --pre-bg:          #0d1117;
            --pre-border:      #30363d;
            --bq-border:       #475569;
            --link:            #38bdf8;
        }
        [data-theme="light"] {
            --bg:              #f8fafc;
            --surface:         #ffffff;
            --surface2:        #f1f5f9;
            --border:          #e2e8f0;
            --text:            #1e293b;
            --text-muted:      #475569;
            --text-dim:        #94a3b8;
            --msg-user-bg:     #2563eb;
            --msg-user-text:   #ffffff;
            --msg-ai-bg:       #ffffff;
            --msg-ai-text:     #1e293b;
            --msg-ai-border:   #e2e8f0;
            --code-inline-bg:  #f1f5f9;
            --pre-bg:          #f6f8fa;
            --pre-border:      #d0d7de;
            --bq-border:       #d0d7de;
            --link:            #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
        header h1 span { color: #38bdf8; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        /* ── Buttons ── */
        .btn {
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.15s;
            white-space: nowrap;
            background: var(--surface2);
            color: var(--text-muted);
        }
        .btn:hover { background: var(--border); color: var(--text); }
        .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: transparent; color: #f87171; border-color: #f87171; }
        .btn-danger:hover { background: #7f1d1d33; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Dropdown ── */
        .dropdown { position: relative; }
        .dropdown-menu {
            position: absolute; right: 0; top: calc(100% + 4px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 148px;
            z-index: 60;
            display: none;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .dropdown-menu.open { display: block; }
        .dropdown-menu button {
            display: block; width: 100%;
            padding: 9px 14px;
            text-align: left; background: none; border: none;
            color: var(--text); cursor: pointer; font-size: 0.82rem;
            transition: background 0.1s;
        }
        .dropdown-menu button:hover { background: var(--border); }

        /* ── System prompt panel ── */
        #system-panel {
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
            flex-shrink: 0;
        }
        #system-panel.open { max-height: 160px; }
        .system-inner { padding: 10px 18px; display: flex; flex-direction: column; gap: 7px; }
        .system-inner label { font-size: 0.75rem; color: var(--text-dim); }
        .system-row { display: flex; gap: 8px; }
        #system-input {
            flex: 1;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 8px;
            font-size: 0.88rem; resize: none; outline: none;
            min-height: 58px; transition: border-color 0.2s;
        }
        #system-input:focus { border-color: #2563eb; }
        #system-input::placeholder { color: var(--text-dim); }

        /* ── Chat container ── */
        #chat-container {
            flex: 1; overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; gap: 14px;
        }

        /* ── Messages ── */
        .message {
            max-width: 78%;
            padding: 11px 15px;
            border-radius: 16px;
            word-wrap: break-word;
            font-size: 0.93rem;
            line-height: 1.65;
        }
        .message.user {
            align-self: flex-end;
            background: var(--msg-user-bg);
            color: var(--msg-user-text);
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--msg-ai-bg);
            color: var(--msg-ai-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--msg-ai-border);
        }
        .message.error {
            align-self: center;
            background: #7f1d1d;
            color: #fca5a5;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .message.streaming { white-space: pre-wrap; }

        /* ── Markdown styles inside assistant bubble ── */
        .md-content { line-height: 1.7; }
        .md-content > * + * { margin-top: 0.6em; }
        .md-content h1,.md-content h2,.md-content h3,
        .md-content h4,.md-content h5,.md-content h6 {
            font-weight: 600; margin-top: 0.8em; margin-bottom: 0.3em;
        }
        .md-content h1 { font-size: 1.3em; }
        .md-content h2 { font-size: 1.15em; }
        .md-content h3 { font-size: 1.05em; }
        .md-content p { margin-bottom: 0.4em; }
        .md-content ul,.md-content ol { padding-left: 1.4em; margin: 0.4em 0; }
        .md-content li { margin: 0.15em 0; }
        .md-content strong { font-weight: 600; }
        .md-content em { font-style: italic; }
        .md-content a { color: var(--link); text-decoration: underline; }
        .md-content hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
        .md-content blockquote {
            border-left: 3px solid var(--bq-border);
            padding-left: 12px;
            color: var(--text-muted);
            margin: 0.4em 0;
        }
        .md-content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.88em; }
        .md-content th,.md-content td {
            border: 1px solid var(--border); padding: 6px 10px; text-align: left;
        }
        .md-content th { background: var(--surface2); font-weight: 600; }

        /* inline code */
        .md-content code {
            background: var(--code-inline-bg);
            padding: 1px 5px; border-radius: 4px;
            font-family: 'Consolas','Fira Code',monospace;
            font-size: 0.88em;
        }

        /* code block wrapper */
        .code-block {
            border: 1px solid var(--pre-border);
            border-radius: 10px;
            overflow: hidden;
            margin: 0.5em 0;
        }
        .code-header {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--pre-bg);
            padding: 5px 12px;
            border-bottom: 1px solid var(--pre-border);
        }
        .code-lang { font-size: 0.75rem; color: var(--text-dim); font-family: monospace; }
        .copy-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-muted); padding: 2px 8px;
            border-radius: 5px; font-size: 0.72rem; cursor: pointer;
            transition: all 0.15s;
        }
        .copy-btn:hover { background: var(--border); color: var(--text); }
        .copy-btn.copied { color: #4ade80; border-color: #4ade80; }
        .code-block pre {
            margin: 0; background: var(--pre-bg);
            padding: 12px 14px; overflow-x: auto;
            font-size: 0.85rem; line-height: 1.55;
        }
        .code-block pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; }

        /* think block */
        .think-block { border-left: 3px solid var(--border); padding-left: 10px; margin: 6px 0; }
        .think-block summary { font-size: 0.78rem; color: var(--text-dim); cursor: pointer; user-select: none; }
        .think-block summary:hover { color: var(--text-muted); }
        .think-content { font-size: 0.82rem; color: var(--text-dim); white-space: pre-wrap; margin-top: 4px; }

        /* typing indicator */
        .typing { align-self: flex-start; color: var(--text-dim); font-size: 0.85rem; padding: 6px 0; }
        .typing span { animation: blink 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

        /* welcome */
        .welcome { text-align: center; color: var(--text-dim); margin: auto; padding: 40px; }
        .welcome h2 { font-size: 1.4rem; color: var(--text-muted); margin-bottom: 8px; }

        /* ── Input area ── */
        #input-area {
            background: var(--surface);
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            display: flex; gap: 10px; align-items: flex-end;
            flex-shrink: 0;
        }
        #message-input {
            flex: 1;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border);
            padding: 9px 13px;
            border-radius: 12px; font-size: 0.93rem;
            outline: none; transition: border-color 0.2s;
            resize: none; min-height: 42px; max-height: 140px; line-height: 1.5;
        }
        #message-input:focus { border-color: #2563eb; }
        #message-input::placeholder { color: var(--text-dim); }
        #send-btn {
            background: #2563eb; color: #fff; border: none;
            padding: 9px 20px; border-radius: 12px; font-size: 0.93rem;
            cursor: pointer; transition: background 0.2s; height: 42px; white-space: nowrap;
        }
        #send-btn:hover { background: #1d4ed8; }
        #send-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; width: 580px; max-width: 95vw; max-height: 80vh;
            display: flex; flex-direction: column;
            transform: translateY(12px); transition: transform 0.2s;
        }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal-header {
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-header h2 { font-size: 0.97rem; font-weight: 600; }
        .modal-close {
            background: none; border: none; color: var(--text-dim);
            font-size: 1.1rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .modal-close:hover { background: var(--border); color: var(--text); }
        .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }

        /* history list */
        .history-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border); margin-bottom: 8px;
            transition: background 0.15s;
        }
        .history-item:hover { background: var(--surface2); }
        .history-info { flex: 1; min-width: 0; }
        .history-title { font-size: 0.88rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-meta { font-size: 0.74rem; color: var(--text-dim); margin-top: 2px; }
        .history-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .empty-history { text-align: center; color: var(--text-dim); padding: 28px; }

        /* save input */
        .save-row { display: flex; gap: 8px; }
        #save-title-input {
            flex: 1; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); padding: 8px 12px;
            border-radius: 8px; font-size: 0.88rem; outline: none;
        }
        #save-title-input:focus { border-color: #2563eb; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
            padding: 9px 20px; border-radius: 8px;
            font-size: 0.84rem; z-index: 200; pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
        }
        .toast.show { opacity: 1; }
        .toast-success { background: #16a34a; color: #fff; }
        .toast-error   { background: #dc2626; color: #fff; }

        /* ── Print / Export PDF ── */
        @media print {
            header, #system-panel, #input-area,
            .modal-overlay, .header-actions { display: none !important; }
            body { background: #fff !important; color: #000 !important; height: auto; }
            #chat-container { overflow: visible !important; padding: 20px !important; gap: 10px !important; }
            .message { max-width: 90% !important; border: 1px solid #ccc !important; }
            .message.user { background: #dbeafe !important; color: #1e40af !important; }
            .message.assistant { background: #f8fafc !important; color: #1e293b !important; }
            .message.error { display: none !important; }
            .code-block { border: 1px solid #ccc !important; }
            .code-header { background: #f1f5f9 !important; }
            .code-block pre { background: #f8fafc !important; }
            .think-block { display: none !important; }
            .welcome { display: none !important; }
        }

        @media (max-width: 600px) {
            .message { max-width: 92%; }
            header { padding: 10px 12px; }
            #input-area { padding: 10px 12px; }
            #chat-container { padding: 14px; }
        }
    </style>
</head>
<body>

<header>
    <h1><span>ThaiLLM</span> Pathumma Chat</h1>
    <div class="header-actions">
        <button class="btn" id="sys-btn" onclick="toggleSystemPanel()">⚙ System Prompt</button>
        <button class="btn" onclick="openHistoryModal()">📂 ประวัติ</button>
        <button class="btn btn-success" onclick="openSaveModal()">💾 บันทึก</button>
        <!-- Export dropdown -->
        <div class="dropdown" id="export-dropdown">
            <button class="btn" onclick="toggleDropdown()">⬇ Export</button>
            <div class="dropdown-menu" id="export-menu">
                <button onclick="exportTxt()">📄 Export .txt</button>
                <button onclick="exportPdf()">🖨 Export PDF</button>
            </div>
        </div>
        <button class="btn" id="theme-btn" onclick="toggleTheme()" title="สลับธีม">🌙</button>
        <button class="btn" onclick="clearChat()">🗑 Clear</button>
    </div>
</header>

<!-- System Prompt Panel -->
<div id="system-panel">
    <div class="system-inner">
        <label>กำหนดบทบาทให้ AI (System Prompt)</label>
        <div class="system-row">
            <textarea id="system-input" rows="2"
                placeholder="เช่น: คุณเป็นผู้ช่วย HR ที่ตอบคำถามเกี่ยวกับนโยบายบริษัท ตอบเป็นภาษาไทยเสมอ"></textarea>
            <button class="btn btn-primary" onclick="applySystemPrompt()" style="align-self:flex-end">ใช้งาน</button>
        </div>
    </div>
</div>

<!-- Chat -->
<div id="chat-container">
    <div class="welcome">
        <h2>Pathumma Chat</h2>
        <p>พิมพ์ข้อความเพื่อเริ่มสนทนากับ ThaiLLM</p>
    </div>
</div>

<!-- Input -->
<div id="input-area">
    <textarea id="message-input" rows="1"
        placeholder="พิมพ์ข้อความ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)"></textarea>
    <button id="send-btn" onclick="sendMessage()">ส่ง</button>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="history-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>📂 ประวัติการสนทนา</h2>
            <button class="modal-close" onclick="closeModal('history-modal')">✕</button>
        </div>
        <div class="modal-body" id="history-list"></div>
    </div>
</div>

<!-- Save Modal -->
<div class="modal-overlay" id="save-modal">
    <div class="modal">
        <div class="modal-header">
            <h2>💾 บันทึกการสนทนา</h2>
            <button class="modal-close" onclick="closeModal('save-modal')">✕</button>
        </div>
        <div class="modal-body">
            <p style="font-size:0.83rem;color:var(--text-muted);margin-bottom:12px">
                ตั้งชื่อการสนทนา (ถ้าไม่ระบุจะใช้ข้อความแรก)
            </p>
            <div class="save-row">
                <input type="text" id="save-title-input" placeholder="ชื่อการสนทนา...">
                <button class="btn btn-success" onclick="saveChat()">บันทึก</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- CDN libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<script>
    /* ── marked setup ── */
    marked.use({
        breaks: true,
        gfm: true,
        renderer: {
            code({ text, lang }) {
                const validLang = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
                const highlighted = hljs.highlight(text, { language: validLang, ignoreIllegals: true }).value;
                const displayLang = escHtml(lang || 'text');
                return `<div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${displayLang}</span>
                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                    </div>
                    <pre><code class="hljs">${highlighted}</code></pre>
                </div>`;
            }
        }
    });

    /* ── State ── */
    const chatContainer = document.getElementById('chat-container');
    const messageInput  = document.getElementById('message-input');
    const sendBtn       = document.getElementById('send-btn');

    let messages       = [];
    let systemPrompt   = '';
    let isFirstMessage = true;
    let isStreaming    = false;
    let isDark         = true;

    /* ── Auto-resize textarea ── */
    messageInput.addEventListener('input', () => {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    });
    messageInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    /* ── Theme toggle ── */
    function toggleTheme() {
        isDark = !isDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
        document.getElementById('hljs-theme').href = isDark
            ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
            : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    // Restore saved theme
    if (localStorage.getItem('theme') === 'light') toggleTheme();

    /* ── System Prompt ── */
    function toggleSystemPanel() {
        const panel = document.getElementById('system-panel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open'))
            document.getElementById('system-input').value = systemPrompt;
    }
    function applySystemPrompt() {
        systemPrompt = document.getElementById('system-input').value.trim();
        document.getElementById('system-panel').classList.remove('open');
        const btn = document.getElementById('sys-btn');
        btn.style.color       = systemPrompt ? '#38bdf8' : '';
        btn.style.borderColor = systemPrompt ? '#38bdf8' : '';
        if (systemPrompt) showToast('ตั้ง System Prompt แล้ว', 'success');
    }

    /* ── Render markdown (assistant messages) ── */
    function renderAssistantContent(el, text) {
        el.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.className = 'md-content';

        // Split out <think>...</think> blocks first
        const thinkRe = /<think>([\s\S]*?)<\/think>/g;
        const thinks = [];
        const replaced = text.replace(thinkRe, (_, inner) => {
            thinks.push(inner.trim());
            return `\x00THINK${thinks.length - 1}\x00`;
        });

        const parts = replaced.split(/\x00THINK(\d+)\x00/);
        for (let i = 0; i < parts.length; i++) {
            if (i % 2 === 0) {
                if (parts[i].trim()) {
                    const div = document.createElement('div');
                    div.innerHTML = DOMPurify.sanitize(marked.parse(parts[i]));
                    wrapper.appendChild(div);
                }
            } else {
                const details = document.createElement('details');
                details.className = 'think-block';
                const summary = document.createElement('summary');
                summary.textContent = 'ความคิด (คลิกเพื่อดู)';
                const content = document.createElement('div');
                content.className = 'think-content';
                content.textContent = thinks[parseInt(parts[i])];
                details.append(summary, content);
                wrapper.appendChild(details);
            }
        }
        el.appendChild(wrapper);
    }

    function addMessage(text, role) {
        if (isFirstMessage) { chatContainer.innerHTML = ''; isFirstMessage = false; }
        const div = document.createElement('div');
        div.className = `message ${role}`;
        if (role === 'assistant') renderAssistantContent(div, text);
        else div.textContent = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    /* ── Send + Stream ── */
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || isStreaming) return;

        messageInput.value = '';
        messageInput.style.height = 'auto';
        addMessage(text, 'user');
        messages.push({ role: 'user', content: text });

        sendBtn.disabled = true;
        isStreaming = true;

        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.id = 'typing-indicator';
        typing.innerHTML = 'กำลังพิมพ์ <span>.</span><span>.</span><span>.</span>';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        let assistantDiv = null;
        let fullReply = '';

        try {
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages, system_prompt: systemPrompt })
            });

            if (!res.ok) {
                const err = await res.json();
                typing.remove();
                addMessage(err.error || 'เกิดข้อผิดพลาด', 'error');
                messages.pop();
                return;
            }

            const reader  = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer    = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    let data;
                    try { data = JSON.parse(line.slice(6)); } catch { continue; }

                    if (data.error) {
                        typing.remove();
                        addMessage(data.error, 'error');
                        messages.pop();
                        return;
                    }
                    if (data.content) {
                        if (!assistantDiv) {
                            typing.remove();
                            // Show raw text during streaming
                            assistantDiv = document.createElement('div');
                            assistantDiv.className = 'message assistant streaming';
                            chatContainer.appendChild(assistantDiv);
                        }
                        fullReply += data.content;
                        assistantDiv.textContent = fullReply;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }
            }

            // Streaming done — render as markdown
            typing.remove();
            if (!assistantDiv) {
                addMessage('(ไม่มีคำตอบ)', 'assistant');
            } else if (fullReply) {
                assistantDiv.className = 'message assistant';
                renderAssistantContent(assistantDiv, fullReply);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            if (fullReply) messages.push({ role: 'assistant', content: fullReply });

        } catch (err) {
            typing.remove();
            addMessage('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            messages.pop();
        } finally {
            isStreaming = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }
    }

    /* ── Copy code button ── */
    async function copyCode(btn) {
        const code = btn.closest('.code-block').querySelector('code').textContent;
        await navigator.clipboard.writeText(code);
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }

    /* ── Clear ── */
    function clearChat() {
        messages = [];
        chatContainer.innerHTML = `
            <div class="welcome">
                <h2>Pathumma Chat</h2>
                <p>พิมพ์ข้อความเพื่อเริ่มสนทนากับ ThaiLLM</p>
            </div>`;
        isFirstMessage = true;
        messageInput.focus();
    }

    /* ── Export ── */
    function toggleDropdown() {
        document.getElementById('export-menu').classList.toggle('open');
    }
    document.addEventListener('click', e => {
        if (!document.getElementById('export-dropdown').contains(e.target))
            document.getElementById('export-menu').classList.remove('open');
    });

    function exportTxt() {
        document.getElementById('export-menu').classList.remove('open');
        if (!messages.length) { showToast('ไม่มีข้อความ', 'error'); return; }
        const lines = messages.map(m =>
            `[${m.role === 'user' ? 'คุณ' : 'AI'}]\n${m.content}`
        ).join('\n\n' + '─'.repeat(40) + '\n\n');
        const header = `ThaiLLM Pathumma Chat\nExported: ${new Date().toLocaleString('th-TH')}\n${'═'.repeat(40)}\n\n`;
        const blob = new Blob([header + lines], { type: 'text/plain;charset=utf-8' });
        dlBlob(blob, `chat_${Date.now()}.txt`);
    }

    function exportPdf() {
        document.getElementById('export-menu').classList.remove('open');
        if (!messages.length) { showToast('ไม่มีข้อความ', 'error'); return; }
        window.print();
    }

    function dlBlob(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    /* ── Modal helpers ── */
    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('.modal-overlay').forEach(m =>
        m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); })
    );

    /* ── History ── */
    async function openHistoryModal() {
        openModal('history-modal');
        const list = document.getElementById('history-list');
        list.innerHTML = '<div class="empty-history">กำลังโหลด...</div>';
        try {
            const items = await fetch('/api/history').then(r => r.json());
            if (!items.length) { list.innerHTML = '<div class="empty-history">ยังไม่มีประวัติที่บันทึก</div>'; return; }
            list.innerHTML = '';
            for (const item of items) {
                const date = item.saved_at ? new Date(item.saved_at).toLocaleString('th-TH') : '';
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-info">
                        <div class="history-title">${escHtml(item.title)}</div>
                        <div class="history-meta">${date} · ${item.message_count} ข้อความ</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn btn-primary" onclick="loadChat('${item.id}')">โหลด</button>
                        <button class="btn btn-danger" onclick="deleteChat('${item.id}',this)">ลบ</button>
                    </div>`;
                list.appendChild(div);
            }
        } catch { list.innerHTML = '<div class="empty-history">โหลดประวัติไม่สำเร็จ</div>'; }
    }

    async function loadChat(id) {
        try {
            const data = await fetch(`/api/history/${id}`).then(r => r.json());
            messages = data.messages || [];
            systemPrompt = data.system_prompt || '';
            document.getElementById('system-input').value = systemPrompt;
            const btn = document.getElementById('sys-btn');
            btn.style.color = btn.style.borderColor = systemPrompt ? '#38bdf8' : '';
            chatContainer.innerHTML = ''; isFirstMessage = false;
            for (const m of messages) addMessage(m.content, m.role);
            closeModal('history-modal');
            messageInput.focus();
        } catch { showToast('โหลดไม่สำเร็จ', 'error'); }
    }

    async function deleteChat(id, btn) {
        if (!confirm('ลบการสนทนานี้?')) return;
        try {
            await fetch(`/api/history/${id}`, { method: 'DELETE' });
            btn.closest('.history-item').remove();
            if (!document.getElementById('history-list').children.length)
                document.getElementById('history-list').innerHTML =
                    '<div class="empty-history">ยังไม่มีประวัติที่บันทึก</div>';
        } catch { showToast('ลบไม่สำเร็จ', 'error'); }
    }

    /* ── Save ── */
    function openSaveModal() {
        if (!messages.length) { showToast('ยังไม่มีข้อความ', 'error'); return; }
        document.getElementById('save-title-input').value = '';
        openModal('save-modal');
        setTimeout(() => document.getElementById('save-title-input').focus(), 100);
    }
    async function saveChat() {
        const title = document.getElementById('save-title-input').value.trim();
        try {
            const res = await fetch('/api/history/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, messages, system_prompt: systemPrompt })
            });
            const data = await res.json();
            if (res.ok) { closeModal('save-modal'); showToast(`บันทึกแล้ว: ${data.title}`, 'success'); }
            else showToast(data.error || 'บันทึกไม่สำเร็จ', 'error');
        } catch { showToast('บันทึกไม่สำเร็จ', 'error'); }
    }
    document.getElementById('save-title-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') saveChat();
    });

    /* ── Toast ── */
    let toastTimer;
    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type} show`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ── Util ── */
    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    messageInput.focus();
</script>
</body>
</html>
